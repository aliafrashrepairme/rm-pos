.login-screen{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--bg)}.login-brand-panel{background:#171717;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}.login-brand-mark{width:58px;height:58px;border-radius:16px;background:var(--yellow);color:#171717;display:grid;place-items:center;font-size:27px;font-weight:900;margin-bottom:22px}.login-brand-panel h1{font-size:36px;line-height:1.12;margin:0 0 16px}.login-brand-panel p{color:#c9c9c9;line-height:1.7;font-size:16.5px}.login-panel{display:flex;align-items:center;justify-content:center;padding:28px}.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.login-card h2{font-size:27px;margin:0 0 8px}.login-sub{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 24px}.login-card .field{margin-bottom:15px}.login-card .field input{padding:12px;font-size:16px}.login-submit{width:100%;justify-content:center;padding:13px;font-size:16px;margin-top:5px}.login-demo{background:var(--soft);border-radius:10px;padding:12px;margin-top:18px;font-size:13px;line-height:1.7}.user-pill{font-size:13px;padding:7px 10px;border-radius:20px;background:var(--soft);font-weight:800}.hidden-by-role{display:none!important}@media(max-width:760px){.login-screen{grid-template-columns:1fr}.login-brand-panel{padding:24px;gap:20px}.login-brand-panel h1{font-size:28px}.login-panel{padding:16px}}

/* ===== Advanced inventory modules (same palette as base theme) ===== */
.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px;overflow:auto}
.tabs button{background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;font-size:14px;font-weight:700;white-space:nowrap}
.tabs button.active{background:var(--yellow);color:#171717}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px}.meter>i{display:block;height:100%;background:var(--green);border-radius:6px}.meter.warn>i{background:var(--yellow)}.meter.red>i{background:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:20px;font-size:12px;font-weight:800;background:var(--soft);color:#8a6700;white-space:nowrap}
.chip.green{background:#e8f7ef;color:#13734b}.chip.red{background:#ffecec;color:#b12e2e}.chip.gray{background:#eff0f3;color:#5f636b}
.dark .chip{color:#f1d978}.dark .chip.green{background:#123726;color:#6fdcaa}.dark .chip.red{background:#3c1a1a;color:#ff9a9a}.dark .chip.gray{background:#2a2b30;color:#b9bbc2}
.modal{max-height:92vh;overflow:auto}.modal.wide{width:min(880px,100%)}.modal-fields.block{display:block}
.lb{display:grid;gap:8px}.lb-row{display:grid;gap:8px;align-items:center}.lb-row.po{grid-template-columns:minmax(0,1fr) 80px 110px 35px}.lb-row.adj{grid-template-columns:minmax(0,1fr) 110px 35px}
.lb-head{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.lb-row select,.lb-row input,.inp{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:var(--panel);color:var(--text);font-size:14px;min-width:0;width:100%;outline:none}
.dark .lb-row select,.dark .lb-row input,.dark .inp,.dark .mini-input{background:#222327;color:#eee}
.mini-input{width:70px;border:1px solid var(--line);border-radius:7px;padding:6px;font-size:14px;background:var(--panel);color:var(--text);outline:none}
.mini-input:focus,.inp:focus{border-color:var(--yellow)}
.stepper{display:inline-flex;align-items:center;gap:5px}.stepper button{width:24px;height:24px;border-radius:6px;background:var(--line);color:var(--text);font-weight:900}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.list-row:last-child{border-bottom:0}
.task{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--panel);text-align:left;width:100%;color:var(--text);font-weight:700}
.task:hover{border-color:#e4bf25}.task .kpi-icon{flex-shrink:0}.task .arrow{margin-left:auto;color:var(--muted)}
.ai-badge{background:linear-gradient(90deg,#f6c928,#ffe27a);color:#171717;font-size:12px;font-weight:900;padding:4px 8px;border-radius:20px;letter-spacing:.5px;white-space:nowrap}
.nav .new{margin-left:auto;font-size:11px;background:#f6c928;color:#171717;padding:2px 5px;border-radius:5px;font-weight:900}
.nav button.active .new{background:#171717;color:#f6c928}
/* AI invoice scan */
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;background:var(--bg);transition:.15s}
.dropzone.drag{border-color:var(--yellow);background:var(--soft)}.dropzone .big{font-size:34px;display:block;margin-bottom:8px}
.doc-stage{position:relative;border-radius:12px;overflow:hidden;background:#e9eaee;padding:16px;min-height:430px}
.dark .doc-stage{background:#0d0e10}.doc-stage img{max-width:100%;display:block;margin:auto;border-radius:4px;box-shadow:0 6px 20px #0003}
.paper{background:#fff;color:#222;border-radius:4px;padding:20px;font-size:9px;box-shadow:0 6px 20px #0002;font-family:'Courier New',monospace;max-width:460px;margin:auto;line-height:1.5}
.paper table{min-width:0}.paper th{background:#f3f3f3;color:#444;font-size:8px;padding:6px}.paper td{font-size:8.5px;padding:6px;white-space:normal;color:#222;border-bottom:1px solid #eee}
.paper .ph{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #222;padding-bottom:9px;margin-bottom:10px}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--yellow);box-shadow:0 0 18px 6px rgba(246,201,40,.55);top:0;animation:scan 1.5s ease-in-out infinite alternate;display:none;z-index:2}
.scanning .scanline{display:block}.scanning .paper,.scanning img{filter:saturate(.6)}
@keyframes scan{from{top:3%}to{top:95%}}
.hl{border-radius:3px;transition:.35s}.extracted .hl{background:rgba(246,201,40,.28);box-shadow:0 0 0 1.5px rgba(214,168,0,.9)}
.steps{display:grid;gap:9px}.step{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}
.step i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;flex-shrink:0}
.step.active{color:var(--text);font-weight:800}.step.active i{border-color:var(--yellow);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--text)}.step.done i{background:var(--green);border-color:var(--green);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--yellow);transition:width .4s}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 0;line-height:1.45}.check b{width:18px;flex-shrink:0;text-align:center}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.conf{font-size:11px;font-weight:900;margin-left:5px;padding:2px 5px;border-radius:10px;background:#e8f7ef;color:#13734b}.conf.mid{background:#fff5d7;color:#9b7100}
/* Barcode scanner */
.viewfinder{position:relative;background:#0f0f0f;border-radius:14px;height:270px;overflow:hidden;display:grid;place-items:center;color:#aaa;font-size:14px;text-align:center;padding:20px}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf-frame{position:absolute;inset:24% 14%;border:2px solid rgba(246,201,40,.95);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.vf-laser{position:absolute;left:15%;right:15%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 10px #ff4d4d;animation:laser 1.3s ease-in-out infinite alternate;pointer-events:none}
@keyframes laser{from{top:28%}to{top:72%}}
.vf-msg{position:relative;z-index:1;max-width:280px;line-height:1.6}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{padding:8px 11px;border-radius:20px;font-size:13px;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.seg button.active{background:var(--yellow);border-color:var(--yellow);color:#171717}
.barcode-box{background:#fff;border-radius:8px;padding:6px 8px;display:inline-block;border:1px solid var(--line);line-height:0}
.label-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.bc-label{background:#fff;color:#111;border:1px dashed #bbb;border-radius:8px;padding:10px;text-align:center;font-size:9px;break-inside:avoid}
.bc-label b{display:block;font-size:11px;margin-bottom:1px}.bc-label .lp{font-size:13px;font-weight:900;margin-top:3px}
.flash{animation:flash .7s}@keyframes flash{0%{box-shadow:0 0 0 0 rgba(246,201,40,.9)}100%{box-shadow:0 0 0 14px rgba(246,201,40,0)}}
.login-logo{display:block;width:100%;max-width:460px;aspect-ratio:1998/1116;object-fit:cover;border-radius:18px;margin-bottom:26px;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 1px rgba(246,201,40,.18)}@media(max-width:900px){.login-logo{max-width:300px;margin-bottom:18px}}
#printArea{display:none}
.receipt{background:#fff;color:#111;width:300px;max-width:100%;margin:auto;padding:18px 16px;font-family:'Courier New',monospace;font-size:11px;line-height:1.5;border-radius:6px;box-shadow:0 6px 22px #0002}.receipt .c{text-align:center}.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}.receipt .r{display:flex;justify-content:space-between;gap:8px}.receipt .big{font-size:14px;font-weight:900}.receipt .it{margin-bottom:4px}.receipt .muted{color:#555}.receipt-stage{background:#e9eaee;border-radius:12px;padding:18px}.dark .receipt-stage{background:#0d0e10}
@media print{body.print-labels .receipt{box-shadow:none;width:72mm;padding:0}}
@media print{.sidebar,.topbar,.toast,.modal-backdrop{display:none!important}body.print-labels>*:not(#printArea){display:none!important}body.print-labels #printArea{display:block!important;padding:10px}#printArea .label-grid{grid-template-columns:repeat(3,1fr)}}
/* Mobile app */
.mobile-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.phone{width:350px;height:720px;background:#111;border-radius:44px;padding:11px;box-shadow:0 30px 60px rgba(0,0,0,.22),inset 0 0 0 2px #2c2c2c;position:relative;flex-shrink:0;margin:auto}
.phone:before{content:"";position:absolute;top:19px;left:50%;transform:translateX(-50%);width:88px;height:22px;background:#000;border-radius:20px;z-index:3}
.phone-screen{height:100%;border-radius:34px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.m-status{height:44px;flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px 5px;font-size:11.5px;font-weight:800;background:var(--panel)}
.m-head{padding:8px 16px 11px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.m-head strong{font-size:15px}.m-head small{display:block;font-size:10.5px;color:var(--muted)}
.m-body{flex:1;overflow:auto;padding:12px 13px}
.m-tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 6px 14px;flex-shrink:0}
.m-tabs button{background:transparent;color:var(--muted);font-size:10.5px;display:grid;gap:3px;justify-items:center;padding:5px 0;font-weight:700}
.m-tabs button span{font-size:16px;padding:1px 12px;border-radius:9px}.m-tabs button.active{color:var(--text)}.m-tabs button.active span{background:var(--yellow);color:#171717}
.m-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:9px}
.m-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}.m-tiles .m-card{margin:0}
.m-tiles b{display:block;font-size:16px;margin-top:4px}.m-tiles small{font-size:10.5px;color:var(--muted)}
.m-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.m-action{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 3px;display:grid;justify-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--text)}
.m-action span{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:16px}
.m-vf{height:215px;border-radius:14px;background:#0f0f0f;position:relative;overflow:hidden;margin-bottom:10px;display:grid;place-items:center;color:#aaa;font-size:11.5px}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11.5px}.m-row:last-child{border-bottom:0}
.m-row strong{font-size:12px;display:block}.m-row small{font-size:10px;color:var(--muted)}
.m-search{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;background:var(--panel);color:var(--text);outline:none;margin-bottom:9px}
.m-btn{width:100%;justify-content:center;padding:11px;border-radius:11px}
.qr{width:124px;height:124px;display:grid;grid-template-columns:repeat(25,1fr);background:#fff;padding:7px;border-radius:9px;border:1px solid var(--line)}.qr i.b{background:#111}
.platforms{display:flex;gap:8px;flex-wrap:wrap}
.store-btn{display:flex;align-items:center;gap:9px;background:#171717;color:#fff;padding:9px 14px;border-radius:10px;font-size:10.5px;text-align:left}.store-btn b{display:block;font-size:13.5px}.store-btn span{font-size:20px}
.feature{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.feature:last-child{border-bottom:0}.feature strong{font-size:14px;display:block}.feature small{font-size:13px;color:var(--muted);line-height:1.5}
/* charts and suppliers */
.chart{width:100%;max-width:640px;height:auto;display:block}.chart text{fill:var(--muted);font-size:10px;font-family:inherit}.chart .v{fill:var(--text);font-weight:800}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stars{color:#e0a800;letter-spacing:1px;font-size:14px}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.sup-card .setting-line{padding:8px 0;font-size:14px}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:900;font-size:16px;flex-shrink:0}
@media(max-width:1100px){.mobile-wrap{grid-template-columns:1fr}.kpis.k4{grid-template-columns:repeat(2,1fr)}.three-col{grid-template-columns:1fr}}
@media(max-width:700px){.nav .new{display:none}.field-grid{grid-template-columns:1fr}.lb-row.po{grid-template-columns:minmax(0,1fr) 56px 76px 30px}.phone{width:290px;height:600px}}


.sum-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.sum-strip>div{display:grid;gap:5px;padding:15px 18px;border-right:1px solid var(--line)}.sum-strip>div:last-child{border-right:0}.sum-strip .sl{font-size:13px;color:var(--muted);font-weight:700}.sum-strip b{font-size:23px;letter-spacing:-.4px}
.dchip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:12.5px;font-weight:800;white-space:nowrap}
.dchip.up{background:#e3f5ec;color:#0f6b44}.dchip.down{background:#fde8e6;color:#a3261b}.dchip.flat{background:#eff0f3;color:#5f636b}.dchip.mid{background:#fff3d1;color:#8a6400}
.dark .dchip.up{background:#123726;color:#6fdcaa}.dark .dchip.down{background:#3c1a1a;color:#ff9a9a}.dark .dchip.flat{background:#2a2b30;color:#b9bbc2}.dark .dchip.mid{background:#3a3115;color:#f1d978}
.wide-chart{max-width:100%!important}.bar-hit{cursor:pointer}.bar-hit:hover rect:nth-child(2){opacity:.8}
.hm-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.hm-h{font-size:12px;color:var(--muted);font-weight:800;text-align:center;padding-bottom:2px}
.hm-cell{border:0;border-radius:8px;padding:6px 4px;min-height:48px;display:grid;align-content:center;justify-items:center;gap:1px;font-size:11.5px;cursor:pointer}.hm-cell b{font-size:13px}.hm-cell:hover{outline:2px solid #171717}
.hm-empty{background:var(--bg);color:var(--muted);cursor:default;border:1px dashed var(--line)}
.pay-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:0}
.stack-row{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;font-weight:700}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;background:var(--panel)}.stack i{display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;font-weight:800}
@media(max-width:900px){.sum-strip{grid-template-columns:repeat(2,1fr)}.sum-strip>div:nth-child(2){border-right:0}}

.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kw{display:grid;gap:6px;justify-items:start;align-content:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);text-align:left;cursor:pointer}
.kw:hover{border-color:var(--yellow)}.kw .kw-ico{font-size:18px}.kw b{font-size:30px;line-height:1;letter-spacing:-.5px}
.kw-tag{font-size:12px;font-weight:900;letter-spacing:1px;background:#3a3a3d;color:#f2f2f2;padding:4px 9px;border-radius:7px}
.kw.hot .kw-tag{background:var(--yellow);color:#171717}
.offer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;margin-bottom:12px;font-size:13px;line-height:1.45}
.offer.first{background:#fff3d1;color:#5a4300;border:1px dashed #e0a800}.offer.loyal{background:#e3f5ec;color:#0f5a3a;border:1px solid #9fdcbd}
.dark .offer.first{background:#3a3115;color:#f6d97a;border-color:#8a6a00}.dark .offer.loyal{background:#123726;color:#8fe6bf;border-color:#1e5a3f}
.coupon-row{display:flex;gap:6px;margin-bottom:12px}.coupon-row .inp{flex:1;text-transform:uppercase}
.total-row.disc{color:#18865b}.dark .total-row.disc{color:#6fdcaa}
.bill-band{text-align:center;font-weight:900;letter-spacing:1.5px;padding:6px 4px;margin:8px -16px;font-size:12px}
.bill-band.dist{background:#f6c928;color:#171717}
.pbill{background:#fff;color:#171717;width:560px;max-width:100%;margin:auto;border-radius:8px;overflow:hidden;font-family:Inter,Arial,sans-serif;font-size:12px;box-shadow:0 6px 22px #0002}
.pb-band{background:#171717;color:#f6c928;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:12px}.pb-band span{color:#ddd;font-size:11px}
.pb-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 18px;border-bottom:1px solid #eee}.pb-meta div{display:grid;gap:2px}.pb-meta span{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.6px}.pb-meta small{color:#666;font-size:10.5px}
.pb-table{width:100%;border-collapse:collapse;min-width:0}.pb-table th{background:#f6c928;color:#171717;font-size:10px;padding:7px 10px;text-align:right}.pb-table th:first-child,.pb-table td:first-child{text-align:left}.pb-table td{padding:8px 10px;border-bottom:1px solid #eee;text-align:right;font-size:11.5px;color:#171717;white-space:normal}
.pb-tot{padding:12px 18px;display:grid;gap:4px;justify-items:end}.pb-tot div{display:flex;gap:30px}.pb-tot .big{font-size:15px;font-weight:900}.pb-foot{padding:10px 18px;background:#fafafa;color:#777;font-size:10.5px}
.product-art{background:#fff7d6!important}.dark .product-art{background:#2b2715!important}.pimg{background:transparent!important}.pimg.lg{background:none!important}
@media print{body.print-labels .pbill{box-shadow:none;width:100%}}

/* v11: denser low-stock yellow + larger product names */
.status.warn{background:#ffc21a!important;color:#2b1f00!important}.status.warn .dot{background:#2b1f00!important}
.dark .status.warn{background:#ffb000!important;color:#1a1300!important}
.chip:not(.green):not(.red):not(.gray){background:#ffc21a;color:#2b1f00}
.meter.warn>i{background:#ffb000!important}
.product-tile .stock.low{color:#ffb000;font-weight:900}.product-tile .stock.out{color:#e5483b;font-weight:900}.dark .product-tile .stock.low{color:#ffc21a}
.dchip.mid{background:#ffc21a!important;color:#2b1f00!important}
.offer.first{border-color:#ffb000!important}
.product-tile strong{font-size:16.5px!important;line-height:1.22;white-space:normal!important;display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.44em}
.bl-prod b{font-size:17px!important}
.pname{font-size:16.5px!important}
.list-row .pname{font-size:16px!important}
.m-row .pname,.m-row strong{font-size:13px!important}
.chart text{font-size:12.5px!important}
.seg button{font-size:14px}
/* v14: fixed sidebar — stays in place while the page scrolls */
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;align-self:flex-start;scrollbar-width:thin;scrollbar-color:#444 transparent}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:#444;border-radius:6px}
.side-bottom{margin-top:auto}
/* ==== v6: bigger, bolder, friendlier ==== */
.product-grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))!important;gap:9px}
body{font-weight:600}td{font-weight:600}th{font-weight:800}.sub,small,.kpi-foot,.light-note,.page-head p,.muted{font-weight:600}
input,select,textarea,button{font-weight:700}.nav button{font-weight:700;padding-top:11px;padding-bottom:11px}
.pimg{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,#fff7cf,#f5e5a0);object-fit:contain;vertical-align:middle;margin-right:10px;padding:3px;flex-shrink:0}
.pimg.lg{width:100%;height:100%;margin:0;padding:6px;background:none;border-radius:0}.pimg.xs{width:36px;height:36px;margin-right:0}
.product-art{height:78px;padding:0;overflow:hidden;margin-bottom:7px}.product-tile{padding:8px;color:var(--text)}.product-tile strong{font-size:13.5px;display:block;margin-bottom:2px;line-height:1.25}.product-tile small{font-size:11.5px}.product-tile .price{font-size:13.5px}.product-tile .tile-bottom{flex-wrap:wrap}.product-tile .stock{font-size:11.5px}
.pos-layout{grid-template-columns:minmax(0,1.25fr) minmax(430px,1fr)}
.bill-head,.bill-line{display:grid;grid-template-columns:minmax(0,1fr) 84px 92px 92px;gap:8px;align-items:center}
.bill-head{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800;padding:2px 0 9px;border-bottom:2px solid var(--line)}
.bill-line{padding:10px 0;border-bottom:1px solid var(--line)}.bl-prod{display:flex;align-items:center;gap:9px;min-width:0}.bl-prod b{font-size:15px;line-height:1.25;white-space:normal}
.bl-price{text-align:right;font-size:14px;font-weight:700}.bl-total{text-align:right;font-size:15px;font-weight:900}.bill-head span:nth-child(n+2){text-align:right}.bill-head span:nth-child(3){text-align:center}
.bill-line .qty{justify-content:center}.bill-line .qty button{width:30px;height:30px;font-size:17px}.bill-line .qty span{min-width:22px;text-align:center;font-size:16px;font-weight:900}
.bill-lines{max-height:340px;overflow:auto;margin-bottom:8px}
.pay-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 10px}
.pay-seg button{padding:12px 6px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--text);font-weight:800;font-size:14px}
.pay-seg button.active{background:var(--yellow);border-color:var(--yellow);color:#171717}
.cash-label{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px;display:block}
.cash-input{width:100%;font-size:26px;font-weight:900;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);outline:none;box-sizing:border-box}.cash-input:focus{border-color:var(--yellow)}
.cash-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.cash-row button{flex:1;padding:10px 6px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-weight:800;font-size:13px;min-width:70px}
.balance{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border-radius:13px;background:var(--bg);margin:14px 0 12px;font-weight:800;font-size:16px;border:2px solid var(--line)}.balance b{font-size:26px;letter-spacing:-.5px;white-space:nowrap}
.balance.ok{background:#e8f7ef;color:#13734b;border-color:#9fdcbd}.balance.due{background:#ffecec;color:#b12e2e;border-color:#f3b4b4}
.dark .balance.ok{background:#123726;color:#6fdcaa;border-color:#1e5a3f}.dark .balance.due{background:#3c1a1a;color:#ff9a9a;border-color:#6b2b2b}
.dark .cash-input{background:#222327}.cart-actions .btn{font-size:15px;padding:14px}
.tab-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 14px}
.count-summary{display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--soft);margin-bottom:14px;font-size:14px}.count-summary .meter{width:130px}
.dark .count-summary{background:#2a2614}
.modal.mid{width:min(640px,100%)}
.inner-seg{margin-bottom:14px}
</style>

/* ================= EAN-13 BARCODE SVG ================= */
const EL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const ER=EL.map(s=>s.replace(/./g,c=>c==='0'?'1':'0'));const EG=ER.map(s=>s.split('').reverse().join(''));
const EPAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanSVG(code,w=180,h=56){if(!/^\d{13}$/.test(code))return '';let par=EPAR[+code[0]],bits='101';for(let i=1;i<=6;i++)bits+=(par[i-1]==='L'?EL:EG)[+code[i]];bits+='01010';for(let i=7;i<=12;i++)bits+=ER[+code[i]];bits+='101';
let m=w/(95+14),x0=m*9,r='',guard=i=>i<3||(i>=45&&i<50)||i>=92;for(let i=0;i<95;i++)if(bits[i]==='1')r+=`<rect x="${(x0+i*m).toFixed(2)}" y="0" width="${(m+.02).toFixed(2)}" height="${guard(i)?h-4:h-14}"/>`;
return `<svg viewBox="0 0 ${w} ${h+2}" width="${w}" height="${h+2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barcode ${code}"><rect width="${w}" height="${h+2}" fill="#fff"/><g fill="#111">${r}</g><g fill="#111" font-family="monospace" font-size="${(m*7).toFixed(1)}" text-anchor="middle"><text x="${m*4}" y="${h}">${code[0]}</text><text x="${x0+m*24}" y="${h}">${code.slice(1,7)}</text><text x="${x0+m*71}" y="${h}">${code.slice(7)}</text></g></svg>`}

function openProductModal(){openModal('Add product','Create a hardware product record. A barcode is generated automatically.',[{label:'Product name',name:'name',required:true,full:true},{label:'Category',name:'category',options:CATS()},{label:'Unit',name:'unit',options:['Piece','Bag','Length','Pack','Roll','Tin','Set','Pair']},{label:'Cost price (LKR)',name:'cost',type:'number',required:true},{label:'Selling price (LKR)',name:'price',type:'number',required:true},{label:'Tax %',name:'tax',type:'number',value:'18'},{label:'Opening stock',name:'stock',type:'number',value:'0'},{label:'Reorder level',name:'reorder',type:'number',value:'10'},{label:'Location',name:'location',value:'Shelf A1'},{label:'Preferred supplier',name:'supplier',options:suppliers.map(s=>s.id+' — '+s.name),full:true},{label:'Product photo (optional)',name:'photo',type:'file',full:true}],d=>{let id=nextId('RM-',products,4);let p={id,name:d.name,category:d.category,unit:d.unit,cost:+d.cost,price:+d.price,tax:+d.tax,stock:+d.stock,reorder:+d.reorder,location:d.location,supplier:d.supplier.split(' — ')[0],icon:'📦',sold30:0,lastSale:0};p.barcode=ean13('4791234'+id.slice(3).padStart(5,'0'));products.push(p);readPhoto(p);if(p.stock)logMove(id,'Opening',p.stock,'NEW');addAudit('Product created',id);toast('Product added: '+id)})}
function readPhoto(p){let f=document.querySelector('#modalFields [name=photo]')?.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{p.img=r.result;render();applyTranslations();toast('Photo saved for '+p.name+'.')};r.readAsDataURL(f)}

function purchasesPage(){let open=purchases.filter(p=>['Ordered','Partially Received'].includes(p.status)),awaiting=open.reduce((s,p)=>s+p.lines.reduce((x,l)=>x+(l.qty-l.received)*l.cost,0),0),payable=suppliers.reduce((s,x)=>s+supBalance(x.id),0),drafts=purchases.filter(p=>p.status==='Draft').length;

function setPoFilter(f){poFilter=f;render();applyTranslations()}
function draftHtml(kind){return `<div class="lb-row ${kind} lb-head"><span>Product</span>${kind==='po'?'<span>Qty</span><span>Unit cost</span>':'<span>Qty +/−</span>'}<span></span></div><div class="lb">${draft.map((l,i)=>`<div class="lb-row ${kind}"><select onchange="draft[${i}].sku=this.value;${kind==='po'?`draft[${i}].cost=P(this.value).cost;refreshDraft('po')`:`draftTotal('adj')`}">${products.map(p=>`<option value="${p.id}" ${p.id===l.sku?'selected':''}>${esc(p.name)} (${p.stock} in stock)</option>`).join('')}</select>${kind==='po'?`<input type="number" min="1" value="${l.qty}" oninput="draft[${i}].qty=+this.value;draftTotal('po')"><input type="number" value="${l.cost}" oninput="draft[${i}].cost=+this.value;draftTotal('po')">`:`<input type="number" value="${l.change}" oninput="draft[${i}].change=+this.value;draftTotal('adj')">`}<button class="icon-btn" title="Remove line" onclick="draft.splice(${i},1);refreshDraft('${kind}')">×</button></div>`).join('')}</div><div class="section-row" style="margin-top:10px"><button class="btn btn-outline btn-sm" onclick="draft.push(${kind==='po'?'{sku:products[0].id,qty:1,cost:products[0].cost}':'{sku:products[0].id,change:-1}'});refreshDraft('${kind}')">＋ Add line</button><b id="draftTotal" style="font-size:15px"></b></div>`}
function refreshDraft(k){document.getElementById('draftBox').innerHTML=draftHtml(k);draftTotal(k)}
function draftTotal(k){let el=document.getElementById('draftTotal');if(!el)return;if(k==='po')el.textContent='Order total: '+money(draft.reduce((s,l)=>s+l.qty*l.cost,0));else{let q=draft.reduce((s,l)=>s+(+l.change||0),0);el.innerHTML=`Total change: <b>${q>0?'+':''}${q}</b> units`}}
function suggestFor(sid){return products.filter(p=>p.supplier===sid&&p.stock<=p.reorder).map(p=>({sku:p.id,qty:Math.max(p.reorder*2-p.stock,p.reorder),cost:p.cost}))}
function openPOModal(sid){sid=sid||suppliers[0].id;draft=suggestFor(sid);if(!draft.length)draft=[{sku:products.find(p=>p.supplier===sid)?.id||products[0].id,qty:10,cost:(products.find(p=>p.supplier===sid)||products[0]).cost}];
openHtmlModal('New purchase order','Low-stock items for the selected supplier are suggested automatically.',`<div class="field-grid"><label class="field">Supplier<select id="poSup" onchange="draft=suggestFor(this.value);if(!draft.length)draft=[{sku:products[0].id,qty:10,cost:products[0].cost}];refreshDraft('po');document.getElementById('poLead').textContent='Lead time '+S(this.value).lead+' days · '+S(this.value).terms">${suppliers.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select><span class="sub" id="poLead">Lead time ${S(sid).lead} days · ${S(sid).terms}</span></label><label class="field">Expected delivery<input id="poExp" type="date" value="${addDays(S(sid).lead).toISOString().slice(0,10)}"></label></div><div id="draftBox" style="margin-top:14px">${draftHtml('po')}</div>`,()=>{if(!draft.length){toast('Add at least one line.');return false}let id=nextId('PO-',purchases,4),sup=document.getElementById('poSup').value,exp=document.getElementById('poExp').value;purchases.unshift({id,supplier:sup,ordered:dateStr(),expected:exp?dateStr(new Date(exp)):'—',status:'Ordered',paid:0,source:'Manual',lines:draft.map(l=>({...l,received:0}))});addAudit('Purchase order created',id);toast(id+' sent to '+S(sup).name+'.')},{mid:true,saveLabel:'Create & send PO'});setTimeout(()=>draftTotal('po'),0)}
function quickPO(sku){if(!can('purchases'))return toast('Your role cannot create purchase orders.');go('purchases');openPOModal(P(sku).supplier)}
function autoReorder(){let made=[];suppliers.forEach(s=>{let l=suggestFor(s.id).filter(x=>!purchases.some(po=>['Draft','Ordered','Partially Received'].includes(po.status)&&po.lines.some(pl=>pl.sku===x.sku&&pl.qty-pl.received>0)));if(l.length){let id=nextId('PO-',purchases,4);purchases.unshift({id,supplier:s.id,ordered:dateStr(),expected:dateStr(addDays(s.lead)),status:'Draft',paid:0,source:'Auto-reorder',lines:l.map(x=>({...x,received:0}))});made.push(id)}});if(made.length){addAudit('Auto-reorder drafts',made.join(', '));poFilter='Draft';go('purchases');toast(made.length+' draft PO(s) created from reorder levels.')}else toast('Nothing to reorder — open orders already cover low stock.')}

function payPO(id){let p=purchases.find(x=>x.id===id),bal=poTotal(p)-p.paid;openModal('Record supplier payment',`${id} · ${S(p.supplier).name} · Balance ${money(bal)}`,[{label:'Amount (LKR)',name:'amount',type:'number',value:bal,required:true},{label:'Method',name:'method',options:['Bank transfer','Cash','Cheque']},{label:'Reference',name:'ref',full:true,placeholder:'Cheque no. / transfer ref'}],d=>{p.paid=Math.min(poTotal(p),p.paid+(+d.amount));addAudit('Supplier payment',id+' · '+money(+d.amount));toast('Payment recorded.')})}

d.setFillColor(246,201,40);d.rect(8,y-4,W-16,7,'F');d.setTextColor(20);d.setFont('helvetica','bold');d.setFontSize(8);[['Product',10],['Ordered',70],['Received',88],['Unit cost',120],['Amount',W-10]].forEach(([h,x],i)=>d.text(h,x,y+1,{align:i>=3?'right':'left'}));y+=8;d.setFont('helvetica','normal');

function countStats(c){let done=c.lines.filter(l=>l.counted!==null&&l.counted!=='').length,varU=0,varV=0;c.lines.forEach(l=>{if(l.counted!==null&&l.counted!==''){let d=+l.counted-l.system;varU+=d;varV+=d*(P(l.sku)?.cost||0)}});return {done,total:c.lines.length,varU,varV,acc:c.lines.length?Math.round(c.lines.filter(l=>l.counted!==null&&+l.counted===l.system).length/Math.max(done,1)*100):100}}
function stockCountsPage(){if(openCountId)return countDetail();return {bar:`<button class="btn btn-primary" onclick="openNewCount()">＋ New stock count</button>`,body:table(['Count','Name','Created','Counted by','Progress','Status','Action'],stockCounts.map(c=>{let s=countStats(c);return tr([`<b>${c.id}</b>`,c.name+(c.blind?' <span class="chip gray">Blind</span>':''),c.created,c.by,`<div style="display:flex;align-items:center;gap:7px">${meter(s.done,s.total)}<span class="muted">${s.done}/${s.total}</span></div>`,status(c.status),`<button class="btn ${c.status==='In Progress'?'btn-primary':'btn-outline'} btn-sm" onclick="openCountId='${c.id}';render()">${c.status==='In Progress'?'Continue':'Open'}</button>`])}))}}
function openNewCount(){openModal('New stock count','Snapshot system quantities and start counting.',[{label:'Count name',name:'name',required:true,full:true,value:'Cycle count — '+dateStr()},{label:'Scope',name:'scope',options:['Full store','Below reorder level',...CATS().filter(c=>products.some(p=>p.category===c))]},{label:'Blind count',name:'blind',options:['No — show system qty','Yes — hide system qty']}],d=>{let list=d.scope==='Full store'?products:d.scope==='Below reorder level'?products.filter(p=>p.stock<=p.reorder):products.filter(p=>p.category===d.scope);if(!list.length){toast('No products match this scope.');return false}let id=nextId('SC-',stockCounts);stockCounts.unshift({id,name:d.name,scope:d.scope,created:nowStr(),by:who(),status:'In Progress',blind:d.blind.startsWith('Yes'),lines:mkLines(list)});openCountId=id;addAudit('Stock count started',id);toast(id+' started with '+list.length+' items.')})}
function countDetail(){let c=stockCounts.find(x=>x.id===openCountId),s=countStats(c),edit=c.status==='In Progress';return {bar:`<button class="btn btn-outline" onclick="openCountId=null;render()">← All counts</button>${edit?`<button class="btn btn-outline" onclick="c_blind()">${c.blind?'◉ Show':'◌ Hide'} system qty</button><button class="btn btn-primary" onclick="submitCount()">Submit for approval</button>`:''}${c.status==='Submitted'?(canApprove()?`<button class="btn btn-outline" onclick="reopenCount()">Re-open</button><button class="btn btn-primary" onclick="approveCount()">✓ Approve & update stock</button>`:`<span class="chip">Waiting for manager approval</span>`):''}`,body:`<div class="count-summary"><span><b style="font-size:16px">${c.id} · ${esc(c.name)}</b><br><span class="sub">${c.scope} · started ${c.created} by ${c.by} · ${c.status}${c.blind?" · blind count":""}</span></span><span>Counted <b id="cProg">${s.done}/${s.total}</b></span><span id="cMeter">${meter(s.done,s.total)}</span></div>${edit?`<div class="card" style="margin-bottom:14px"><div class="section-row" style="margin:0"><div class="search"><span>⌸</span><input id="countScan" inputmode="numeric" placeholder="Scan or type a barcode — adds +1 automatically" oninput="autoCode(this,v=>countScan(v))" onkeydown="if(event.key==='Enter'){countScan(this.value);this.value=''}"></div></div></div>`:''}`+table(['Product','Location','System qty','Counted'],c.lines.map((l,i)=>{let p=P(l.sku);return tr([`<span style="display:flex;align-items:center">${pic(p)}<b class="pname">${esc(p.name)}</b></span>`,p.location,c.blind&&edit?'<span class="muted">•••</span>':l.system,edit?`<span class="stepper"><button onclick="bump(${i},-1)">−</button><input class="mini-input" id="cnt${i}" type="number" min="0" value="${l.counted??''}" placeholder="—" oninput="setCount(${i},this.value)"><button onclick="bump(${i},1)">+</button></span>`:`<b>${l.counted??'—'}</b>`],`id="crow${i}"`)}))}}
function curCount(){return stockCounts.find(x=>x.id===openCountId)}
function setCount(i,v){let c=curCount();c.lines[i].counted=v===''?null:Math.max(0,+v);updCount(i)}
function bump(i,n){let c=curCount(),l=c.lines[i];l.counted=Math.max(0,(+l.counted||0)+n);let el=document.getElementById('cnt'+i);if(el)el.value=l.counted;updCount(i)}
function updCount(i){let c=curCount(),s=countStats(c),a=document.getElementById('cProg'),m=document.getElementById('cMeter');if(a)a.textContent=s.done+'/'+s.total;if(m)m.innerHTML=meter(s.done,s.total)}
function countScan(v,silent){let c=curCount()||stockCounts.find(x=>x.status==='In Progress');if(!c)return toast('No count in progress.');let p=findCode(v);if(!p)return toast('Unknown barcode: '+v);let i=c.lines.findIndex(l=>l.sku===p.id);if(i<0){c.lines.push({sku:p.id,system:p.stock,counted:0});i=c.lines.length-1}c.lines[i].counted=(+c.lines[i].counted||0)+1;if(currentPage==='inventory'&&invTab==='counts'&&openCountId===c.id){let el=document.getElementById('cnt'+i);if(el){el.value=c.lines[i].counted;updCount(i);let r=document.getElementById('crow'+i);r?.classList.remove('flash');void r?.offsetWidth;r?.classList.add('flash')}else render()}if(!silent)toast(`${p.name}: counted ${c.lines[i].counted}`);return c.lines[i].counted}
function c_blind(){let c=curCount();c.blind=!c.blind;render()}
function submitCount(){let c=curCount(),s=countStats(c);if(s.done<s.total&&!confirm(T(`${s.total-s.done} item(s) not counted yet. Uncounted items keep their system qty. Submit anyway?`)))return;c.lines.forEach(l=>{if(l.counted===null)l.counted=l.system});c.status='Submitted';addAudit('Stock count submitted',c.id);render();toast(c.id+' submitted for manager approval.')}
function reopenCount(){let c=curCount();c.status='In Progress';render()}
function approveCount(){let c=curCount(),n=0;c.lines.forEach(l=>{let d=+l.counted-l.system;if(d){let p=P(l.sku);p.stock=Math.max(0,p.stock+d);logMove(l.sku,'Count',d,c.id);n++}});c.status='Approved';addAudit('Stock count approved',c.id+' · '+n+' variances posted');render();toast(`${c.id} approved · ${n} variance(s) posted to stock.`)}

const REASONS=['Damaged','Expired','Theft / Loss','Found stock','Supplier return','Internal use','Data correction'];
function adjustmentsPage(){return {bar:`<button class="btn btn-primary" onclick="openAdjModal()">＋ New adjustment</button>`,body:searchbar('Search adjustment, reason or product…')+table(['Adj. no.','Date','By','Reason','Items','Qty','Status','Actions'],adjustments.map(a=>{let q=a.lines.reduce((s,l)=>s+l.change,0);return tr([`<b>${a.id}</b>`,a.date,a.by,`<span class="chip gray">${a.reason}</span>`,`<span title="${esc(a.note)}">${a.lines.map(l=>P(l.sku)?.name).join(', ')}</span>`,`<b style="color:${q<0?'#b12e2e':'#18865b'}">${q>0?'+':''}${q}</b>`,status(a.status),a.status==='Pending'&&canApprove()?`<button class="btn btn-primary btn-sm" onclick="decideAdj('${a.id}',true)">Approve</button> <button class="btn btn-outline btn-sm" onclick="decideAdj('${a.id}',false)">Reject</button>`:`<button class="btn btn-outline btn-sm" onclick="viewAdj('${a.id}')">View</button>`])}))}}
function openAdjModal(sku){draft=[{sku:sku||products[0].id,change:-1}];openHtmlModal('New stock adjustment','Choose a reason and the quantities to add (+) or remove (−).',`<div class="field-grid"><label class="field">Reason<select id="adjReason">${REASONS.map(r=>`<option>${r}</option>`).join('')}</select></label><label class="field">Note<input id="adjNote" placeholder="What happened?"></label></div><div id="draftBox" style="margin-top:14px">${draftHtml('adj')}</div>`,()=>{let lines=draft.filter(l=>l.change);if(!lines.length){toast('Enter a non-zero quantity.');return false}let a={id:nextId('ADJ-',adjustments),date:nowStr(),by:who(),reason:document.getElementById('adjReason').value,note:document.getElementById('adjNote').value,status:'Pending',lines:lines.map(l=>({...l}))};let needs=!canApprove();adjustments.unshift(a);if(!needs){applyAdj(a);toast(a.id+' approved and posted.')}else{addAudit('Adjustment submitted',a.id);toast(a.id+' sent for manager approval.')}},{wide:true,saveLabel:'Save adjustment'});setTimeout(()=>draftTotal('adj'),0)}
function applyAdj(a){a.lines.forEach(l=>{let p=P(l.sku);p.stock=Math.max(0,p.stock+l.change);logMove(l.sku,'Adjustment',l.change,a.id)});a.status='Approved';addAudit('Adjustment approved',a.id+' · '+a.reason)}
function decideAdj(id,ok){let a=adjustments.find(x=>x.id===id);if(ok){applyAdj(a);toast(id+' approved · stock updated.')}else{a.status='Rejected';addAudit('Adjustment rejected',id);toast(id+' rejected.')}render()}

function hbar(rows,fmt=kmoney){/* rows may carry .color */let max=Math.max(...rows.map(r=>r.value),1),h=rows.length*30+10,lw=170;return `<svg class="chart" viewBox="0 0 560 ${h}" role="img" aria-label="Bar chart">${rows.map((r,i)=>{let w=(560-lw-100)*r.value/max,y=i*30+8;return `<text x="0" y="${y+13}">${esc(r.label)}</text><rect x="${lw}" y="${y}" width="${Math.max(w,2)}" height="18" rx="4" fill="${r.color||'#f6c928'}"><title>${esc(r.label)}: ${fmt(r.value)}</title></rect><text class="v" x="${lw+w+7}" y="${y+13}">${fmt(r.value)}</text>`}).join('')}</svg>`}
function vbars(labels,a,b){let max=Math.max(...a,...b,1),W=520,H=190,bw=(W-40)/labels.length;return `<svg class="chart" viewBox="0 0 ${W} ${H+24}" role="img" aria-label="Stock in versus out">${[0,.5,1].map(t=>`<line x1="30" x2="${W}" y1="${H-t*(H-10)}" y2="${H-t*(H-10)}" stroke="currentColor" opacity=".12"/><text x="0" y="${H-t*(H-10)+3}">${Math.round(max*t)}</text>`).join('')}${labels.map((l,i)=>{let x=34+i*bw,ha=(H-10)*a[i]/max,hb=(H-10)*b[i]/max;return `<rect x="${x+bw*.15}" y="${H-ha}" width="${bw*.3}" height="${ha}" rx="3" fill="#18865b"><title>In: ${a[i]}</title></rect><rect x="${x+bw*.5}" y="${H-hb}" width="${bw*.3}" height="${hb}" rx="3" fill="#ffb000"><title>Out: ${b[i]}</title></rect><text x="${x+bw*.45}" y="${H+16}" text-anchor="middle">${l}</text>`}).join('')}</svg><div class="legend"><span><i style="background:#18865b"></i>Stock in</span><span><i style="background:#ffb000"></i>Stock out</span></div>`}
function abc(){let a=products.map(p=>({p,rev:p.sold30*p.price})).sort((x,y)=>y.rev-x.rev),tot=a.reduce((s,x)=>s+x.rev,0)||1,c=0;return a.map(x=>{c+=x.rev;let pct=c/tot*100;return {...x,cum:pct,cls:pct<=80||x===a[0]?'A':pct<=95?'B':'C'}})}
function cover(p){let d=p.sold30/30;return d?Math.round(p.stock/d):Infinity}
const C_OUT='#c0392b',C_IN='#18865b',C_MID='#ffb000';
const stColor=p=>p.stock<=0?C_OUT:p.stock<=p.reorder?C_MID:C_IN;
function stLegend(){return `<div class="legend"><span><i style="background:${C_IN}"></i>In stock</span><span><i style="background:${C_MID}"></i>Low stock</span><span><i style="background:${C_OUT}"></i>Out of stock</span></div>`}
function invReportsPage(){let body='',exp=reportTab;if(!['levels','value','reorder','slow','movement'].includes(reportTab))reportTab=exp='levels';
if(reportTab==='levels'){let rows=[...products].sort((a,b)=>a.stock/a.reorder-b.stock/b.reorder);body=`<div class="card"><h3>Stock on hand</h3><div class="sub" style="margin-bottom:10px">Units in stock for each product</div>${hbar(rows.map(p=>({label:p.name,value:Math.max(p.stock,0),color:stColor(p)})),v=>v+' units')}${stLegend()}</div>`}
else if(reportTab==='value'){let cats={};products.forEach(p=>{let c=cats[p.category]=cats[p.category]||{v:0,out:0,low:0};c.v+=p.stock*p.cost;if(p.stock<=0)c.out++;else if(p.stock<=p.reorder)c.low++});let rows=Object.entries(cats).sort((a,b)=>b[1].v-a[1].v);body=`<div class="card"><h3>Stock value by category</h3><div class="sub" style="margin-bottom:10px">At cost price. Colour shows the weakest stock in each category.</div>${hbar(rows.map(([k,c])=>({label:k,value:c.v,color:c.out?C_OUT:c.low?C_MID:C_IN})))}<div class="legend"><span><i style="background:${C_IN}"></i>All in stock</span><span><i style="background:${C_MID}"></i>Some items low</span><span><i style="background:${C_OUT}"></i>Some items out of stock</span></div></div>`}
else if(reportTab==='reorder'){let r=products.filter(p=>p.stock<=p.reorder).map(p=>({p,q:Math.max(p.reorder*2-p.stock,p.reorder)}));body=`<div class="card"><div class="section-row"><div><h3>Quantity to reorder</h3><div class="sub">Suggested order quantity for items at or below reorder level</div></div>${can('purchases')?`<button class="btn btn-primary btn-sm" onclick="autoReorder()">⚡ Create draft POs</button>`:''}</div>${r.length?hbar(r.map(x=>({label:x.p.name,value:x.q,color:stColor(x.p)})),v=>v+' units'):'<div class="empty">Nothing needs reordering.</div>'}<div class="legend"><span><i style="background:${C_MID}"></i>Low stock</span><span><i style="background:${C_OUT}"></i>Out of stock</span></div></div>`}
else if(reportTab==='slow'){let rows=products.map(p=>({p,cov:cover(p)})).sort((x,y)=>(y.cov===Infinity?1e9:y.cov)-(x.cov===Infinity?1e9:x.cov));body=`<div class="card"><h3>Days of stock left</h3><div class="sub" style="margin-bottom:10px">How many days current stock lasts at the usual selling rate</div>${hbar(rows.map(x=>({label:x.p.name,value:x.cov===Infinity?120:Math.min(x.cov,120),color:x.p.stock<=0?C_OUT:x.cov===Infinity||x.cov>60?C_MID:C_IN})),v=>v>=120?'120+ days':v+' days')}<div class="legend"><span><i style="background:${C_IN}"></i>Selling well</span><span><i style="background:${C_MID}"></i>Slow / not selling</span><span><i style="background:${C_OUT}"></i>Out of stock</span></div></div>`}
else{let days=[...Array(7)].map((_,i)=>dateStr(addDays(i-6)).split(' ')[0]),inn=[40,0,62,20,0,55,40],out=[38,45,51,47,60,42,49];body=`<div class="card"><h3>Stock in vs stock out</h3><div class="sub" style="margin-bottom:10px">Units, last 7 days</div>${vbars(days,inn,out)}</div>`}
return {bar:`<button class="btn btn-outline" onclick="window.print()">⎙ Print</button><button class="btn btn-primary" onclick="exportReport('${exp}')">Export CSV</button>`,body:segTabs([['levels','Stock levels'],['value','Stock value'],['reorder','Reorder'],['slow','Slow-moving'],['movement','Stock in / out']],reportTab,'setReportTab')+body}}

function aiPanel(){if(ai.state==='idle')return `<div class="card"><h3>What AI extracts</h3><div class="sub" style="margin-bottom:8px">Ready in seconds instead of manual typing</div>${[['🏷','Supplier & invoice details','Supplier name, invoice no., invoice and due dates'],['📦','Line items','Description, quantity, unit cost and line totals'],['🔗','Smart product matching','Fuzzy-matches supplier wording to your products'],['⚠','Checks','Duplicate invoices, price increases, total mismatches, new products'],['⇩','One-click posting','Creates the purchase, receives stock and updates the ledger']].map(f=>`<div class="feature"><span class="kpi-icon">${f[0]}</span><span><strong>${f[1]}</strong><small>${f[2]}</small></span></div>`).join('')}</div>`;

let r=ai.result,sub=r.lines.reduce((a,l)=>a+l.qty*l.cost,0),tax=sub*r.taxRate/100,dup=postedInvoices.includes(r.invoiceNo),review=r.lines.filter(l=>l.conf<80&&!l.ok).length,news=r.lines.filter(l=>l.sku==='NEW').length,price=r.lines.filter(l=>l.sku!=='NEW'&&P(l.sku)&&l.cost!==P(l.sku).cost);
return `<div class="card" style="margin-bottom:14px"><div class="section-row"><div><h3>Extracted details</h3><div class="sub">Review and edit before posting</div></div><span class="chip green">✓ ${Math.round(r.lines.reduce((a,l)=>a+l.conf,0)/r.lines.length)}% avg confidence</span></div><div class="field-grid"><label class="field">Supplier <span class="conf">99%</span><select id="aiSup">${suppliers.map(s=>`<option value="${s.id}" ${s.id===r.supplier?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="field">Invoice number <span class="conf">98%</span><input id="aiNo" value="${esc(r.invoiceNo)}"></label><label class="field">Invoice date <span class="conf">97%</span><input value="${esc(r.date)}"></label><label class="field">Due date <span class="conf mid">89%</span><input value="${esc(r.due)}"></label></div></div><div class="card" style="margin-bottom:14px"><h3>Line items</h3><div class="sub" style="margin-bottom:10px">${r.lines.length} lines detected · matched to product master</div>${table(['Invoice text','Matched product','Qty','Unit cost','Total','Match'],r.lines.map((l,i)=>{let p=P(l.sku),d=p?Math.round((l.cost-p.cost)/p.cost*1000)/10:0;return tr([`<span class="muted" style="font-family:monospace;font-size:13px">${esc(l.text)}</span>`,`<select class="inp" style="width:165px" onchange="aiSet(${i},'sku',this.value)"><option value="NEW" ${l.sku==='NEW'?'selected':''}>＋ Create new product</option>${products.map(x=>`<option value="${x.id}" ${x.id===l.sku?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`,`<input class="mini-input" style="width:56px" type="number" value="${l.qty}" onchange="aiSet(${i},'qty',+this.value)">`,`<input class="mini-input" style="width:76px" type="number" value="${l.cost}" onchange="aiSet(${i},'cost',+this.value)">${p&&d?`<div style="font-size:12px;margin-top:3px;color:${d>0?'#b12e2e':'#18865b'}">${d>0?'▲':'▼'} ${Math.abs(d)}% vs last</div>`:''}`,money(l.qty*l.cost),l.sku==='NEW'?'<span class="chip">New item</span>':l.conf<80&&!l.ok?`<span class="chip red" style="cursor:pointer" onclick="aiSet(${i},'ok',true)" title="Click to confirm">Review ${l.conf}%</span>`:`<span class="chip green">Matched ${l.conf}%</span>`])}))}<div class="cart-totals"><div class="total-row"><span>Subtotal</span><b>${money(sub)}</b></div><div class="total-row"><span>VAT ${r.taxRate}%</span><b>${money(tax)}</b></div><div class="total-row grand"><span>Invoice total</span><span>${money(sub+tax)}</span></div></div></div><div class="card"><h3>AI checks</h3><div style="margin:6px 0 10px">${`<div class="check"><b>✓</b><span>Supplier recognised as <b>${esc(S(r.supplier).name)}</b> (${r.supplier})</span></div>`}<div class="check"><b>✓</b><span>Totals reconcile: subtotal + VAT = invoice total</span></div>${dup?`<div class="check" style="color:#b12e2e"><b>⦸</b><span><b>Duplicate:</b> invoice ${esc(r.invoiceNo)} has already been posted.</span></div>`:'<div class="check"><b>✓</b><span>No duplicate invoice found</span></div>'}${price.length?`<div class="check"><b>⚠</b><span>${price.length} price change(s): ${price.map(l=>`${P(l.sku).name} ${l.cost>P(l.sku).cost?'up':'down'} to ${money(l.cost)}`).join('; ')}. Product cost will be updated.</span></div>`:''}${review?`<div class="check"><b>⚠</b><span>${review} line(s) with low match confidence — check the product, then click the red chip to confirm.</span></div>`:''}${news?`<div class="check"><b>＋</b><span>${news} new product(s) will be created with an automatic barcode.</span></div>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="aiPost(true)" ${dup?'disabled style="opacity:.5;cursor:not-allowed"':''}>✓ Create purchase & receive stock</button><button class="btn btn-outline" onclick="aiPost(false)" ${dup?'disabled style="opacity:.5;cursor:not-allowed"':''}>Save as draft PO</button></div><div class="sub" style="margin-top:10px">${ai.url?'Prototype: your file is shown for preview; extracted values are sample data. Connect an OCR / AI vision service for live extraction.':'Prototype extraction on a sample invoice.'}</div></div>`}
function bindDrop(){let z=document.getElementById('dropzone');if(!z)return;['dragenter','dragover'].forEach(e=>z.addEventListener(e,ev=>{ev.preventDefault();z.classList.add('drag')}));['dragleave','drop'].forEach(e=>z.addEventListener(e,ev=>{ev.preventDefault();z.classList.remove('drag')}));z.addEventListener('drop',ev=>{let f=ev.dataTransfer.files[0];if(f)aiFile(f)})}
function aiFile(f){if(!f)return;if(ai.url)URL.revokeObjectURL(ai.url);ai.url=URL.createObjectURL(f);ai.isImg=f.type.startsWith('image/');aiStart(f.name)}
function aiStart(name){ai.file=name;if(!name.startsWith('Sample')&&!ai.url)ai.url=null;if(name.startsWith('Sample')){if(ai.url)URL.revokeObjectURL(ai.url);ai.url=null}ai.state='processing';ai.step=0;render();applyTranslations();let tick=()=>{if(currentPage!=='aiscan'||ai.state!=='processing')return;ai.step++;if(ai.step>=AI_STEPS.length){ai.state='done';ai.result=JSON.parse(JSON.stringify(SAMPLE_INV));render();applyTranslations();toast('Invoice extracted — please review.');return}let p=document.getElementById('aiPanel');if(p)p.innerHTML=aiPanel();setTimeout(tick,650)};setTimeout(tick,650)}

function aiPost(receive){let r=ai.result;r.supplier=document.getElementById('aiSup').value;r.invoiceNo=document.getElementById('aiNo').value;if(postedInvoices.includes(r.invoiceNo))return toast('This invoice was already posted.');let id=nextId('PO-',purchases,4),created=[];
r.lines.forEach(l=>{if(l.sku==='NEW'){let nid=nextId('RM-',products,4),name=l.text.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());let p={id:nid,name,category:'Building Materials',unit:'Piece',cost:l.cost,price:Math.round(l.cost*1.25/10)*10,tax:18,stock:0,reorder:5,location:'Receiving',supplier:r.supplier,icon:'📦',sold30:0,lastSale:0};p.barcode=ean13('4791234'+nid.slice(3).padStart(5,'0'));products.push(p);l.sku=nid;created.push(nid)}else{P(l.sku).cost=l.cost}});
let po={id,supplier:r.supplier,ordered:dateStr(),expected:dateStr(),status:receive?'Received':'Draft',paid:0,source:'AI Scan',invoice:r.invoiceNo,lines:r.lines.map(l=>({sku:l.sku,qty:l.qty,received:receive?l.qty:0,cost:l.cost}))};purchases.unshift(po);
if(receive)po.lines.forEach(l=>{P(l.sku).stock+=l.qty;logMove(l.sku,'Purchase',l.qty,id)});postedInvoices.push(r.invoiceNo);addAudit('AI invoice posted',r.invoiceNo+' → '+id+(created.length?' · new: '+created.join(', '):''));resetAi();poFilter='All';go('purchases');toast(receive?`${id} created · ${po.lines.reduce((s,l)=>s+l.qty,0)} units received.`:`${id} saved as draft.`)}

const UP='#18865b',DOWN='#c0392b',FLAT='#ffb000',SEQ=['#fff2c2','#ffe07a','#f6c928','#cf9b00','#8a6400'],PAYC={Cash:'#e0a800',Card:'#18865b','Bank transfer':'#3f4248'};

const CASHIERS=['N. Perera','A. Silva'],CUSTS=['Walk-in Customer','Walk-in Customer','Walk-in Customer','Kumar Hardware Works','S. Construction','Ravi Builders'];
const dkey=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const sameDay=(a,b)=>dkey(a)===dkey(b);
function rnd(n){let x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
const _db={};
function dayBills(d){let k=dkey(d);if(_db[k])return _db[k];let dow=d.getDay(),n=(dow===0?26:dow===6?50:40)+Math.round(rnd(k)*16)+((d.getMonth()%4)*2),L=[];
for(let i=0;i<n;i++){let r=rnd(k*7+i),t=Math.round((700+Math.pow(r,2.3)*24000)/10)*10,m=480+Math.floor(Math.pow(rnd(k*3+i*11),0.9)*600),pr=rnd(k*5+i*13);
L.push({id:'RM-'+String(k).slice(2)+'-'+String(i+1).padStart(2,'0'),mins:m,time:(String(Math.floor(m/60)%12||12).padStart(2,'0'))+':'+String(m%60).padStart(2,'0')+(m>=720?' PM':' AM'),customer:CUSTS[Math.floor(rnd(k+i*19)*CUSTS.length)],cashier:CASHIERS[(i+k)%2],payment:pr<.58?'Cash':pr<.88?'Card':'Bank transfer',items:1+Math.floor(rnd(k*13+i)*7),total:t,status:rnd(k*11+i*17)<.03?'Refunded':'Paid'})}
L.sort((a,b)=>b.mins-a.mins);return _db[k]=L}
function dayList(d){let L=dayBills(d),now=new Date();if(sameDay(d,now)){let m=now.getHours()*60+now.getMinutes();L=L.filter(b=>b.mins<=Math.max(m,600));L=bills.map(b=>({...b,time:String(b.date).replace(/^Today, /,''),mins:1e4})).concat(L)}else if(d>now)L=[];return L}
function daySum(d){let L=dayList(d),p=L.filter(b=>b.status==='Paid'),sales=p.reduce((s,b)=>s+b.total,0);return {sales,bills:L.length,refunds:L.length-p.length,avg:p.length?sales/p.length:0,list:L}}

function monthSum(y,m,limit){let k=y*100+m+'_'+(limit||0);if(_ms[k])return _ms[k];let last=new Date(y,m+1,0).getDate(),today=new Date(),o={sales:0,bills:0,refunds:0,days:0,pay:{Cash:0,Card:0,'Bank transfer':0}};

return _ms[k]=o}

const kshort=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(Math.round(n));
function delta(cur,prev,invert){if(!prev)return '<span class="dchip flat">● new</span>';let p=(cur-prev)/prev*100,c=Math.abs(p)<0.05?'flat':(p>0)!==!!invert?'up':'down';return `<span class="dchip ${c}">${p>0?'▲':p<0?'▼':'●'} ${p>0?'+':''}${p.toFixed(1)}%</span>`}
function marginChip(m){let c=m>=25?'up':m>=20?'mid':'down';return `<span class="dchip ${c}">${Math.round(m)}%</span>`}
function sumStrip(items){return `<div class="sum-strip">${items.map(([l,v])=>`<div><span class="sl">${l}</span><b>${v}</b></div>`).join('')}</div>`}
function varLegend(a,b){return `<div class="legend"><span><i style="background:${UP}"></i>▲ ${a}</span><span><i style="background:${DOWN}"></i>▼ ${b}</span><span><i style="background:${FLAT}"></i>First / no comparison</span></div>`}
function seqLegend(){return `<div class="legend" style="align-items:center"><span>Low</span>${SEQ.map(c=>`<i style="background:${c};width:22px;height:12px;margin:0;border-radius:3px"></i>`).join('')}<span>High</span></div>`}
/* vertical bars, colour = change vs previous bar */
function barsVar(rows,o={}){let W=780,H=220,pl=52,pt=22,pb=32,max=Math.max(...rows.map(r=>r.value),1)*1.15,bw=(W-pl-6)/rows.length,step=rows.length>16?2:1,y=v=>pt+(H-pt)*(1-v/max);
let g=[0,.5,1].map(t=>`<line x1="${pl}" x2="${W}" y1="${y(max*t)}" y2="${y(max*t)}" stroke="currentColor" opacity=".1"/><text x="${pl-8}" y="${y(max*t)+4}" text-anchor="end">${kshort(max*t)}</text>`).join('');
let b=rows.map((r,i)=>{let c=r.color||(i===0?FLAT:r.value>=rows[i-1].value?UP:DOWN),x=pl+i*bw+bw*.16,w=bw*.68,yy=y(r.value),h=Math.max(H-yy,r.value?2:0);
return `<g ${o.click?`class="bar-hit" onclick="${o.click}(${i})"`:''}><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt}" fill="transparent"/><rect x="${x}" y="${yy}" width="${w}" height="${h}" rx="3" fill="${c}" ${r.sel?'stroke="#171717" stroke-width="2.5"':''}/>${r.sel?`<text class="v" x="${x+w/2}" y="${yy-6}" text-anchor="middle">${kshort(r.value)}</text>`:''}${i%step===0||r.sel?`<text x="${x+w/2}" y="${H+18}" text-anchor="middle" ${r.sel?'class="v"':''}>${r.label}</text>`:''}<title>${esc(r.tip||r.label+': '+money(r.value))}</title></g>`}).join('');
return `<svg class="chart wide-chart" viewBox="0 0 ${W} ${H+pb}" role="img" aria-label="${esc(o.aria||'Bar chart')}">${g}<line x1="${pl}" x2="${W}" y1="${H}" y2="${H}" stroke="currentColor" opacity=".3"/>${b}</svg>`}
/* sequential-intensity bars (e.g. hourly) */
function barsSeq(rows){let max=Math.max(...rows.map(r=>r.value),1);return barsVar(rows.map(r=>({...r,color:r.value>=max*.66?UP:r.value<max*.33?DOWN:FLAT})),{aria:'Sales by hour'})}
function busyLegend(){return `<div class="legend"><span><i style="background:${UP}"></i>Busy</span><span><i style="background:${FLAT}"></i>Normal</span><span><i style="background:${DOWN}"></i>Quiet</span></div>`}
/* diverging % change bars */
function divBars(rows){let W=780,rh=32,H=rows.length*rh+10,lw=170,cx=lw+(W-lw)/2,half=(W-lw)/2-60,m=Math.max(...rows.map(r=>Math.abs(r.pct)),5);
return `<svg class="chart wide-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Change versus last month"><line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="currentColor" opacity=".35"/>${rows.map((r,i)=>{let w=Math.abs(r.pct)/m*half,yy=i*rh+6,up=r.pct>=0;return `<g><text x="0" y="${yy+15}">${esc(r.label)}</text><rect x="${up?cx:cx-w}" y="${yy}" width="${Math.max(w,2)}" height="20" rx="3" fill="${up?UP:DOWN}"><title>${esc(r.label)}: ${r.pct>0?'+':''}${r.pct.toFixed(1)}%</title></rect><text class="v" x="${up?cx+w+6:cx-w-6}" y="${yy+15}" text-anchor="${up?'start':'end'}">${up?'▲ +':'▼ '}${r.pct.toFixed(1)}%</text></g>`}).join('')}</svg>`}

function exportDay(){let d=selDay||new Date();csvDownload('rm-transactions-'+iso(d)+'.csv',[['Time','Bill','Customer','Cashier','Payment','Items','Total','Status'],...daySum(d).list.map(b=>[b.time,b.id,b.customer,b.cashier,b.payment,b.items,b.total,b.status])])}
function monthsBack(n){let t=new Date(),o=[];for(let i=n-1;i>=0;i--){let d=new Date(t.getFullYear(),t.getMonth()-i,1);o.push({y:d.getFullYear(),m:d.getMonth()})}return o}

function calHeat(y,m){let last=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7,today=new Date(),vals=[];for(let d=1;d<=last;d++){let dt=new Date(y,m,d);vals.push(dt>today?null:daySum(dt).sales)}
let have=vals.filter(v=>v!=null),mx=Math.max(...have,1),mn=Math.min(...have),best=vals.indexOf(mx),worst=vals.indexOf(mn);
return `<div class="hm-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="hm-h">${w}</div>`).join('')}${'<div></div>'.repeat(first)}${vals.map((v,i)=>{if(v==null)return `<div class="hm-cell hm-empty"><b>${i+1}</b></div>`;let l=Math.min(4,Math.floor((v-mn)/(mx-mn||1)*4.999));return `<button class="hm-cell" style="background:${SEQ[l]};color:${l>=3?'#fff':'#171717'}" onclick="selDay=new Date(${y},${m},${i+1});go('daily')" title="${esc(dlong(new Date(y,m,i+1)))}: ${money(v)}"><b>${i+1}${i===best?' ★':''}</b><span>${kshort(v)}</span></button>`}).join('')}</div>${seqLegend()}<div class="sub" style="margin-top:6px">★ Best day: ${best+1} (${money(mx)}) · Lowest day: ${worst+1} (${money(mn)})</div>`}
function monthlyPage(){let list=monthsBack(12),cur=selMonth||list[11],ci=list.findIndex(x=>x.y===cur.y&&x.m===cur.m),pm=new Date(cur.y,cur.m-1,1);let M=monthSum(cur.y,cur.m),Pm=monthSum(pm.getFullYear(),pm.getMonth(),M.days),ro=isOwner();

let last=new Date(cur.y,cur.m+1,0).getDate(),rows=[],pv=null;for(let d=1;d<=last;d++){let dt=new Date(cur.y,cur.m,d);if(dt>new Date())break;let S=daySum(dt);rows.push(tr([dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}),S.bills,`<b>${money(S.sales)}</b>`,`<button class="btn btn-outline btn-sm" onclick="selDay=new Date(${cur.y},${cur.m},${d});go('daily')">View day</button>`]));pv=S.sales}

function catSplit(y,m,total){let cats={};products.forEach(p=>{cats[p.category]=(cats[p.category]||0)+Math.max(p.sold30,2)*p.price});let w={},sum=0;Object.keys(cats).forEach((c,i)=>{w[c]=cats[c]*(0.75+0.5*rnd(i*31+y*12+m));sum+=w[c]});Object.keys(w).forEach(c=>w[c]=w[c]/sum*total);return w}
function prodSplit(y,m,total){let w={},sum=0;products.forEach((p,i)=>{w[p.id]=Math.max(p.sold30,1)*p.price*(0.7+0.6*rnd(i*17+y*12+m));sum+=w[p.id]});Object.keys(w).forEach(k=>w[k]=w[k]/sum*total);return w}

function setRole(i,r){if(ownerLocked(i)||r==='Owner')return;staff[i].role=r;addAudit('Role changed',staff[i].email+' → '+r);toast(staff[i].name+' is now '+r+'.')}
function toggleUser(i){if(ownerLocked(i))return;let u=staff[i];u.status=u.status==='Active'?'Disabled':'Active';addAudit(u.status==='Active'?'User enabled':'User disabled',u.email);render();toast(u.name+(u.status==='Active'?' can log in again.':' can no longer log in.'))}
function removeUser(i){if(ownerLocked(i))return;let u=staff[i];if(!confirm(T('Remove '+u.name+'? They will no longer be able to log in.')))return;staff.splice(i,1);addAudit('User removed',u.email);render();toast(u.name+' removed.')}
function resetPw(i){if(ownerLocked(i))return;let u=staff[i];openModal('Reset password','Set a new password for '+u.name+' ('+u.email+').',[{label:'New password',name:'pw',type:'password',required:true,full:true}],d=>{if(d.pw.length<6){toast('Password must be at least 6 characters.');return false}u.password=d.pw;addAudit('Password reset',u.email);toast('Password updated for '+u.name+'.')})}
function listsPage(){return head('List management','Configure reusable lists used across the store.')+`<div class="settings-grid">${[['Product categories',CATS().join(', ')],['Units','Piece, Bag, Length, Pack, Roll, Tin, Set'],['Payment methods','Cash, Card, Bank transfer'],['Tax rates','Standard rate: 18% (demo setting)'],['Adjustment reasons',REASONS.join(', ')],['Stock locations','Yard, Rack, Shelf, Bin, Cabinet'],['Bill prefixes','RM-INV'],['Purchase prefixes','PO-']].map(x=>`<div class="card"><div class="section-row"><h3>${x[0]}</h3><button class="btn btn-outline btn-sm" onclick="toast('Edit list: ${x[0]}')">Edit</button></div><p class="sub" style="line-height:1.8">${x[1]}</p></div>`).join('')}</div>`}
function auditPage(){return head('Audit log','Review system actions for accountability and traceability.')+searchbar('Search user, action or reference…')+table(['Time','User','Action','Reference / Details'],audit.map(a=>tr([a.time,`<b>${a.user}</b>`,a.action,a.detail])))}
function settingsPage(){return head('System settings','Configure store details, receipts, appearance and preferences.')+`<div class="settings-grid"><div class="card"><h3>Store details</h3><div class="field" style="margin-top:14px">Store name<input value="RM Hardware Store"></div><div class="field" style="margin-top:11px">Address<textarea rows="2">Jaffna, Sri Lanka</textarea></div><div class="field" style="margin-top:11px">Currency<select><option>LKR — Sri Lankan Rupee</option></select></div><div class="field" style="margin-top:11px">Default tax rate<input value="18%"></div><button class="btn btn-primary" style="margin-top:14px" onclick="toast('Store settings saved in this demo.')">Save settings</button></div><div class="card"><h3>Receipt & billing</h3>${[['Receipt size','80mm thermal / 100mm / A4'],['Bill prefix','RM-INV'],['Show tax breakdown','Display tax separately on receipt'],['Print after payment','Prompt receipt printing after sale'],['Show cash balance','Display change to give the customer']].map((x,i)=>`<div class="setting-line"><span><strong>${x[0]}</strong><small>${x[1]}</small></span><button class="switch ${i!==1?'on':''}" onclick="this.classList.toggle('on')"></button></div>`).join('')}</div><div class="card"><h3>Inventory controls</h3>${[['Block sale when out of stock','Prevent negative stock at the counter',false],['Adjustment approval limit','Above LKR 10,000 requires a manager',true],['Blind counts by default','Hide system quantity from counters',true],['Auto-update cost from AI invoices','Use latest supplier price as product cost',true]].map(x=>`<div class="setting-line"><span><strong>${x[0]}</strong><small>${x[1]}</small></span><button class="switch ${x[2]?'on':''}" onclick="this.classList.toggle('on')"></button></div>`).join('')}</div><div class="card"><h3>Appearance</h3><div class="setting-line"><span><strong>Light theme</strong><small>Pastel yellow and white</small></span><button class="btn btn-outline btn-sm" onclick="setTheme(false)">Use light</button></div><div class="setting-line"><span><strong>Dark theme (default)</strong><small>Yellow and black</small></span><button class="btn btn-outline btn-sm" onclick="setTheme(true)">Use dark</button></div><div class="setting-line"><span><strong>Language</strong><small>English, Tamil or Sinhala</small></span><select onchange="document.getElementById('language').value=this.value;changeLanguage(this.value)">${['English','தமிழ்','සිංහල'].map(l=>`<option value="${l}" ${l===currentLanguage?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="card"><h3>Prototype information</h3><div class="light-note">Interactive front-end prototype with sample data. Payment processing, database storage, live AI/OCR extraction, live authentication and external notifications are not connected. AI invoice scan is available to the Manager role only; barcode label generation and printing are on the Manager dashboard only; customer bill PDF download and printing are for the Cashier role only. The Barcode Scanner is available to the Cashier role only. The Dashboard, User Management and all Administration pages are for the Manager only. Camera barcode decoding works in browsers that support the BarcodeDetector API (e.g. Chrome on Android).</div></div></div>`}

/* ================= ACTIONS ================= */
function filterTable(q){q=q.toLowerCase();document.querySelectorAll('.table-wrap tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function addToCart(id,quiet){let pc=document.getElementById('posCustomer');if(pc)posCustomer=pc.value;let p=P(id);if(p.stock<=0)toast(p.name+' is out of stock — added anyway (demo).');let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({...p,qty:1});if(currentPage==='pos')render();if(!quiet||currentPage==='pos')toast(p.name+' added to cart.')}
function changeQty(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);render()}
function clearCart(){cart=[];cashGiven='';render();toast('Current order cleared.')}
function holdCart(){if(!cart.length)return toast('Add at least one product before holding.');let total=cart.reduce((s,c)=>s+c.price*c.qty*(1+c.tax/100),0);heldOrders.unshift({id:'H-'+String(25+heldOrders.length).padStart(4,'0'),customer:document.getElementById('posCustomer')?.value||'Walk-in Customer',items:cart.reduce((s,c)=>s+c.qty,0),total:Math.round(total),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});cart=[];go('held');toast('Order held successfully.')}
function resumeHeld(i){let h=heldOrders[i];if(!h)return;cart=[];for(let j=0;j<Math.max(1,Math.min(3,h.items));j++)cart.push({...products[j],qty:1});heldOrders.splice(i,1);go('pos');toast('Held order resumed with sample items.')}
function cancelHeld(i){heldOrders.splice(i,1);render();toast('Held order cancelled.')}
function payCart(){if(!cart.length)return toast('The bill is empty. Add a product first.');let {total}=cartTotals(),cash=null,change=null;if(payMethod==='Cash'){cash=cashGiven===''?Math.ceil(total):+cashGiven;if(cash<total-0.001){toast('Cash received is less than the total. Amount still due: '+money(total-cash));document.getElementById('cashIn')?.focus();return}change=cash-total}let id='RM-INV-'+(1049+bills.length-4);bills.unshift({id,customer:document.getElementById('posCustomer')?.value||'Walk-in Customer',date:nowStr(),items:cart.reduce((s,c)=>s+c.qty,0),total:Math.round(total),status:'Paid',cashier:who(),payment:payMethod,cash,change,rate:cartTotals().rate,dlabel:cartTotals().dlabel,points:0,lines:cart.map(c=>({sku:c.id,name:c.name,qty:c.qty,price:c.price,tax:c.tax}))});{let cu=CUST(bills[0].customer);if(cu&&cu[4]!=null){let t=tier(cu),pts=Math.floor(total/100)*(t&&t.name==='Gold'?2:1);cu[3]+=pts;cu[4]++;bills[0].points=pts;bills[0].pointsTotal=cu[3]}}cart.forEach(c=>{let p=P(c.id);p.stock=Math.max(0,p.stock-c.qty);p.sold30+=c.qty;p.lastSale=0;logMove(c.id,'Sale',-c.qty,id)});addAudit('Sale completed',id);cart=[];cashGiven='';posCoupon='';posCustomer='Walk-in Customer';searchTerm='';render();toast(change!=null?`Sale complete · Give balance ${money(change)}`:'Sale complete: '+id);viewBill(id)}
function billAction(i,a){bills[i].status=a==='Refund'?'Refunded':'Voided';addAudit(a+' recorded',bills[i].id);render();openBillsModal();toast(bills[i].id+' marked '+bills[i].status.toLowerCase()+'.')}
function csvDownload(file,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file;a.click();URL.revokeObjectURL(url);toast(file+' exported.')}
function exportProducts(){csvDownload('rm-products.csv',[['SKU','Barcode','Product','Category','Unit','Cost','Price','Tax','Stock','Reorder','Location','Supplier'],...products.map(p=>[p.id,p.barcode,p.name,p.category,p.unit,p.cost,p.price,p.tax,p.stock,p.reorder,p.location,S(p.supplier).name])])}
function exportBills(){csvDownload('rm-bills.csv',[['Bill','Customer','Date','Items','Cashier','Total','Status'],...bills.map(b=>[b.id,b.customer,b.date,b.items,b.cashier,b.total,b.status])])}
function exportInventory(){csvDownload('rm-inventory-ledger.csv',[['Date','SKU','Product','Movement','Change','Balance','Reference'],...inventory.map(x=>[x.date,x.sku,x.product,x.type,x.change,x.after,x.ref])])}
function importCsv(){let f=document.getElementById('csvFile').files[0];toast(f?'Selected '+f.name+' for validation. No data uploaded.':'Choose a CSV file first.')}
function resetModal(){document.getElementById('modalFields').classList.remove('block');document.querySelector('#modalBackdrop .modal').classList.remove('wide','mid');let s=document.getElementById('modalSave');s.textContent='Save record';s.style.display='';document.getElementById('modalCancel').textContent='Cancel'}
function openModal(t,d,fields,cb){resetModal();document.getElementById('modalTitle').textContent=t;document.getElementById('modalDesc').textContent=d;document.getElementById('modalFields').innerHTML=fields.map(f=>`<label class="field ${f.full?'full':''}">${f.label}${f.options?`<select name="${f.name}">${f.options.map(o=>`<option ${f.value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.type==='file'?`<input name="${f.name}" type="file" accept="image/*">`:`<input name="${f.name}" type="${f.type||'text'}" ${f.value!==undefined?`value="${esc(f.value)}"`:''} placeholder="${f.placeholder||''}" ${f.required?'required':''}>`}</label>`).join('');modalCallback=cb;document.getElementById('modalBackdrop').classList.add('show')}
function openHtmlModal(t,d,html,cb,o={}){resetModal();document.getElementById('modalTitle').textContent=t;document.getElementById('modalDesc').textContent=d;let f=document.getElementById('modalFields');f.innerHTML=html;f.classList.add('block');document.querySelector('#modalBackdrop .modal').classList.toggle('wide',!!o.wide);document.querySelector('#modalBackdrop .modal').classList.toggle('mid',!!o.mid);let s=document.getElementById('modalSave');if(o.saveLabel)s.textContent=o.saveLabel;if(o.noSave){s.style.display='none';document.getElementById('modalCancel').textContent='Close'}modalCallback=cb;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalSave').onclick=()=>{let d={};document.querySelectorAll('#modalFields [name]').forEach(e=>d[e.name]=e.value);if([...document.querySelectorAll('#modalFields [required]')].some(e=>!e.value.trim()))return toast('Please complete required fields.');if(modalCallback&&modalCallback(d)===false)return;closeModal();render();applyTranslations()}
function openCustomerModal(){openModal('Add customer','Create a customer profile.',[{label:'Customer name',name:'name',required:true,full:true},{label:'Phone',name:'phone'},{label:'Opening loyalty points',name:'points',type:'number',value:'0'}],d=>{customers.push([d.name,'CUS-'+String(customers.length+1).padStart(3,'0'),d.phone,+d.points]);toast('Customer added.')})}
function openExpenseModal(){openModal('Record expense','Link the expense to the active shift.',[{label:'Category',name:'category',options:['Transport','Utilities','Supplies','Maintenance','Other']},{label:'Amount (LKR)',name:'amount',type:'number',required:true},{label:'Description',name:'note',required:true,full:true}],d=>{expenses.unshift({date:'Today',category:d.category,note:d.note,amount:+d.amount,shift:'SH-020'});addAudit('Expense recorded',d.category);toast('Expense recorded.')})}
function openShiftModal(){openModal('Open cash shift','Enter the opening float.',[{label:'Cashier',name:'cashier',options:['N. Perera','A. Silva','Admin User']},{label:'Opening cash (LKR)',name:'opening',type:'number',value:'10000',required:true}],d=>{let id='SH-'+String(21+shifts.length-2).padStart(3,'0');shifts.unshift({id,cashier:d.cashier,opened:'Just now',opening:+d.opening,expected:+d.opening,status:'Open'});toast('Shift opened: '+id)})}
function closeShift(i){let s=shifts[i];openModal('Close & reconcile shift','Enter the physical cash counted.',[{label:'Shift',name:'id',value:s.id,full:true},{label:'Expected cash (LKR)',name:'expected',type:'number',value:s.expected},{label:'Actual cash counted (LKR)',name:'actual',type:'number',value:s.expected,required:true},{label:'Shift expenses (LKR)',name:'expenses',type:'number',value:'0'}],d=>{s.status='Closed';s.expected=+d.expected;let diff=+d.actual-(+d.expected);addAudit('Shift closed',s.id+' · variance '+money(diff));toast('Shift closed. Cash variance: '+money(diff))})}
function openUserModal(){openModal('Add user','Create a staff login and assign a role.',[{label:'Full name',name:'name',required:true},{label:'Email (login)',name:'email',type:'email',required:true},{label:'Role',name:'role',options:MGR_ROLES},{label:'Password',name:'password',type:'password',required:true}],d=>{let e=d.email.trim().toLowerCase();if(staff.some(u=>u.email===e)){toast('A user with this email already exists.');return false}if(d.password.length<6){toast('Password must be at least 6 characters.');return false}staff.push({name:d.name,email:e,role:d.role,password:d.password,status:'Active'});addAudit('User created',e+' · '+d.role);toast(d.name+' can now log in as '+d.role+'.')})}
function notifications(){let n=[];let low=products.filter(p=>p.stock<=p.reorder).length,pa=adjustments.filter(a=>a.status==='Pending').length,sc=stockCounts.filter(c=>c.status==='Submitted').length;if(can('inventory')&&low)n.push(low+' items low on stock');if(canApprove()&&pa)n.push(pa+' adjustment(s) to approve');if(canApprove()&&sc)n.push(sc+' count(s) to approve');toast(n.length?n.join(' · '):'You are all caught up.')}
function setTheme(d,quiet){document.body.classList.toggle('dark',d);document.getElementById('themeBtn').textContent=d?'☀':'☾';if(!quiet)toast(d?'Dark theme enabled.':'Light theme enabled.')}
setTheme(true,true);
document.getElementById('themeBtn').onclick=()=>setTheme(!document.body.classList.contains('dark'));
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('show'),2600)}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
